<!DOCTYPE html>
<html lang="en">

<head>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- haeder start -->
  <!-- change -->
  <nav class="navbar navbar-expand-lg my-nav">
    <!-- change -->

    <div class="container-fluid">

      <!-- change -->
      <a class="navbar-brand" href="#"> <img width="160" src="assest/imglogo.jpeg" alt="logo"></a>
      <!-- change -->


      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">

        <ul class="navbar-nav me-auto mb-2 theme">

          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#">Home</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="#"> Shop</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="#">Cart</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="#"> checkout</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="#"> Contact</a>
          </li>
        </ul>


        <form class="d-flex nav-search" role="search">
          <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
          <button class="btn " type="submit">Search</button>
        </form>
      </div>
    </div>
  </nav>

  <!-- haeder close -->

  <!-- slider start -->



  <div id="carouselExampleAutoplaying" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000">
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide-to="0" class="active"
        aria-current="true" aria-label="Slide 1"></button>
      <button type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide-to="1"
        aria-label="Slide 2"></button>
      <button type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide-to="2"
        aria-label="Slide 3"></button>
    </div>
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="assest/slidecover.jpg" class="d-block w-100" alt="...">
      </div>
      <div class="carousel-item">
        <img src="assest/slidecover2.jpg" class="d-block w-100" alt="...">
      </div>
      <div class="carousel-item">
        <img src="assest/slide1.jpg" class="d-block w-100" alt="...">
      </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleAutoplaying"
      data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleAutoplaing"
      data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>

  <!-- slider close-->

  <!-- card start -->
  <div class="container">
    <div class="main-box">

      <div class="row">
        <!-- clm 1 -->
        <div class="col">
          <div class="card">
            <img src="assest/lip.jpg"   class="lip" class="card-img-top" alt="...">
            <div class="card-body">
              <h5 class="card-titl"> Lip LIner</h5>
              <p class="card-text"> BN uses this Purfume</p>
              <a href="#" class="btn btn-2"> BN Cosmetics  </a>
            </div>

          </div>
        </div>

        <!-- clm 2 -->
        <div class="col">
          <div class="card">
            <img src="assest/prada.jpg" class="card-img-top" alt="...">
            <div class="card-body">
              <h5 class="card-titl"> Purfume</h5>
              <p class="card-text"> BN uses this Purfume</p>
              <a href="#" class="btn btn-2"> BN Cosmetics</a>
            </div>

          </div>
        </div>

        <!-- clm 3 -->
        <div class="col">
          <div class="card">
            <img src="assest/lipistick.jpg"  class="card-img-top" alt="...">
            <div class="card-body">
              <h5 class="card-titl"> Lipistick</h5>
              <p class="card-text"> BN uses this LIpistick</p>
              <a href="#" class="btn btn-2">  BN Cosmetics</a>
            </div>

          </div>
        </div>


      </div>
    </div>
  </div>

  <!-- card end -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
